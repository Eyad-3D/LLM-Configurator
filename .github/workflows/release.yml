# Publishes to PyPI. Runs ONLY when a version tag such as v0.4.0 is pushed; nothing else triggers it.
#
# One-time setup (PyPI "trusted publishing", no API token stored in GitHub):
#   1. Choose and add a LICENSE before the first release.
#   2. On https://pypi.org/manage/account/publishing/ add a "pending publisher":
#        PyPI project name: llm-configurator
#        Owner: Eyad-3D    Repository: LLM-Configurator
#        Workflow name: release.yml    Environment name: pypi
#   3. In GitHub: Settings -> Environments -> New environment "pypi"
#      (optionally require a reviewer so every release needs a manual approval).
# To release: bump the version in pyproject.toml and src/llm_configurator/__init__.py,
# update CHANGELOG.md, then `git tag v0.4.0 && git push origin v0.4.0`.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag matches package version
        shell: python
        run: |
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", f"Tag {tag} does not match pyproject version {version}"
      - run: python -m pip install build twine
      - run: python -m pip install . && python -m unittest discover -s tests
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llm-configurator/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
