name: Tests
on:
  push:
  pull_request:
  # The real-runtime job (below) is slow, so it runs only by hand and once a week.
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m llm_configurator --help
      - run: python -m llm_configurator recommend --demo --context 2048

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    # Proves `pipx install` / `uvx` will work: the wheel builds, carries its data files, and installs cleanly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Wheel contains every bundled data file
        shell: python
        run: |
          import glob, pathlib, zipfile
          src = pathlib.Path("src")
          expected = {p.relative_to(src).as_posix() for pattern in
                      ["static/*", "evals/*.json", "data/*", "catalogue.json"]
                      for p in (src / "llm_configurator").glob(pattern) if p.is_file()}
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          missing = sorted(expected - set(wheel))
          print("\n".join(sorted(expected)))
          assert "llm_configurator/catalogue.json" in expected, "catalogue.json not found in source"
          assert not missing, f"Missing from wheel: {missing}"
      - name: Install the wheel in a fresh environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/fresh/bin/llm-config --help
          /tmp/fresh/bin/llm-configurator --help

  real-runtime:
    # Builds a real (CPU-only) llama.cpp and runs the app against it with tiny test models.
    # Takes ~15 minutes without a cache, so it runs only by hand (Actions → Tests → Run workflow)
    # and on the weekly schedule, never on every push.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLAMA_WORK_DIR: ${{ github.workspace }}/../llama-work
      LLAMA_CPP_PYTHON_VERSION: '0.3.35'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . gguf
      - name: Restore the llama.cpp build
        uses: actions/cache@v4
        with:
          path: ${{ env.LLAMA_WORK_DIR }}
          key: llama-cpp-${{ runner.os }}-${{ runner.arch }}-${{ env.LLAMA_CPP_PYTHON_VERSION }}-${{ hashFiles('scripts/build_llama_cpp.sh') }}
      - name: Build llama.cpp
        run: |
          # The build is tuned for the CPU that made it (GGML_NATIVE); a cached copy may not run on this runner.
          # If the cached server can't even print its version, drop the cached build and rebuild.
          SERVER=$(ls "$LLAMA_WORK_DIR"/llama_cpp_python-*/vendor/llama.cpp/build/bin/llama-server 2>/dev/null | head -1 || true)
          if [ -n "$SERVER" ] && ! "$SERVER" --version >/dev/null 2>&1; then
            echo "Cached build does not run here; rebuilding."
            rm -rf "$LLAMA_WORK_DIR"/llama_cpp_python-*/vendor/llama.cpp/build
          fi
          BIN=$(bash scripts/build_llama_cpp.sh "$LLAMA_WORK_DIR" | tail -1)
          echo "LLM_CONFIG_REAL_RUNTIME=$BIN" >> "$GITHUB_ENV"
      - name: Make tiny test models
        run: |
          python scripts/make_tiny_models.py "$RUNNER_TEMP/tiny-models" --bin "$LLM_CONFIG_REAL_RUNTIME"
          echo "LLM_CONFIG_TINY_MODELS=$RUNNER_TEMP/tiny-models" >> "$GITHUB_ENV"
      - name: Real-runtime tests
        run: python -m unittest -v tests.integration.test_real_runtime tests.integration.test_fake_matches_real
